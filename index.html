<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ата мен әжеге көмектесейік!</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#7ab8f5;font-family:"Segoe UI","Noto Sans","DejaVu Sans",Arial,sans-serif;color:#3b2a1a;user-select:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;background:#9fd16a}
#bg{position:absolute;inset:0;background-size:cover;background-position:center}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
.col{position:absolute;top:0;width:420px;height:1080px}.L{left:0}.R{right:0}
.card{position:absolute;left:20px;top:20px;width:380px;height:178px;background:#fff8e6;border:6px solid #f2c14e;border-radius:30px;padding:10px 20px;box-shadow:0 6px 0 rgba(0,0,0,.12);transition:.3s}
.card.act{border-color:#ff7a1a;background:#fffbe0;box-shadow:0 0 0 8px rgba(255,150,40,.4),0 6px 0 rgba(0,0,0,.12)}
.tn{font-size:38px;font-weight:800}.sc{position:absolute;right:18px;top:6px;font-size:96px;font-weight:900;color:#d9480f;line-height:1.2}
.turn{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:30px;font-weight:800;color:#d9480f;visibility:hidden}
.act .turn{visibility:visible}
.bkw{position:absolute;left:20px;top:226px;width:380px}
.bk{position:relative;width:380px;height:219px}.bk>img:first-child{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.fr{position:absolute;width:22%;height:38%;transform:translate(-50%,-50%);object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.chr{position:absolute;left:10px;bottom:20px;width:400px;height:560px;object-fit:contain;object-position:bottom;transform-origin:bottom;animation:br 5s ease-in-out infinite}
.R .chr{animation-delay:-2.5s}
@keyframes br{50%{transform:scale(1.015,1.02)}}
#hdr{position:absolute;left:440px;width:1040px;top:20px;height:78px;display:flex;justify-content:space-between;align-items:center;visibility:hidden}
#hdr span{background:#fff8e6;border:5px solid #f2c14e;border-radius:40px;padding:6px 30px;font-size:34px;font-weight:800}
#panel{position:absolute;left:440px;top:112px;width:1040px;height:890px;background:rgba(255,250,236,.96);border:8px solid #f2c14e;border-radius:48px;box-shadow:0 10px 0 rgba(0,0,0,.15);padding:24px 28px}
.scr{display:none;height:100%;flex-direction:column;align-items:center;justify-content:space-between}.scr.on{display:flex}
#home,#fin{justify-content:center;gap:34px;text-align:center}
h1{font-size:80px;line-height:1.1;color:#c2410c;font-weight:900}
.sub{font-size:44px;font-weight:700}.rule{font-size:36px;font-weight:700;background:#fff0c2;border-radius:28px;padding:18px 28px}
.big{background:linear-gradient(#ffa63d,#f06a12);color:#fff;font-size:60px;font-weight:900;padding:20px 70px;border-radius:50px;box-shadow:0 10px 0 #b5470a;transition:.15s}
.big:active{transform:translateY(6px);box-shadow:0 4px 0 #b5470a}
#tools{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:24px}
#tools button{background:#fff8e6;border:4px solid #f2c14e;border-radius:30px;padding:6px 26px;font-size:26px;font-weight:700}
#instr{display:flex;align-items:center;gap:18px;font-size:34px;font-weight:800;min-height:62px}
#instr .chip{display:flex;align-items:center;gap:10px;background:#ffe9a8;border-radius:34px;padding:4px 22px 4px 10px}
#instr img{height:46px;width:46px;object-fit:contain}
#viz{width:100%;height:350px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border-radius:30px;border:4px solid #f7dfa0}
#expr{font-size:90px;font-weight:900;display:flex;gap:22px;align-items:center;min-height:116px}
.box{min-width:100px;height:100px;border:6px dashed #e8832a;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;color:#e8832a;background:#fff3d6}
.box.ok{border:6px solid #2f9e44;color:#2f9e44;background:#e3f7e6}
#ans{display:flex;gap:30px}
.ab{width:290px;height:134px;font-size:68px;font-weight:900;color:#fff;background:linear-gradient(#58a8f0,#2b79d6);border-radius:36px;box-shadow:0 9px 0 #1c4f93;transition:.15s}
.ab:active:not(:disabled){transform:translateY(6px);box-shadow:0 3px 0 #1c4f93}
.ab.bad{background:#b9b9b9;box-shadow:0 9px 0 #8c8c8c;opacity:.55;text-decoration:line-through}
.ab.ok{background:linear-gradient(#5fd068,#2f9e44);box-shadow:0 9px 0 #1f6b2e;animation:gl 1.6s ease-in-out infinite}
.ab.off{opacity:.6}
@keyframes gl{50%{box-shadow:0 9px 0 #1f6b2e,0 0 34px 10px rgba(80,220,100,.65)}}
#bot{width:100%;display:flex;justify-content:space-between;align-items:center;min-height:88px}
#fb{font-size:40px;font-weight:900;flex:1;text-align:left;padding-left:10px}
#fb.g{color:#2f9e44}#fb.r{color:#d9480f}
#next{font-size:44px;font-weight:900;color:#fff;background:linear-gradient(#ffa63d,#f06a12);border-radius:40px;padding:12px 44px;box-shadow:0 8px 0 #b5470a;visibility:hidden}
#next.on{visibility:visible}
/* cups */
.cups{display:flex;align-items:flex-end;gap:26px;padding-top:44px}
.grp{display:flex;gap:2px;position:relative}
.grp.x{border:5px dashed #e8832a;border-radius:22px;padding:8px 10px;max-width:420px;transition:all .7s}
.grp .lab{position:absolute;left:50%;top:-52px;transform:translateX(-50%);font-size:36px;font-weight:900;color:#d9480f;background:#fff0c2;border-radius:20px;padding:0 16px;transition:.5s}
.cup{position:relative;width:96px;height:73px;flex:none}.cup img{width:100%;height:100%;object-fit:contain;display:block}
.add .cup{opacity:.5}.sub .grp.x .cup img{filter:drop-shadow(0 0 7px #ff4d2e)}
.grp.merge{border-color:transparent}.grp.merge .cup{opacity:1}.grp.merge .lab{opacity:0}
.grp.gone{opacity:0;max-width:0;padding:0;border-width:0;overflow:hidden;margin-left:-26px}
.cup.live{cursor:pointer}.cup .bd{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#2b79d6;color:#fff;border-radius:50%;width:44px;height:44px;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center;animation:pp .3s}
@keyframes pp{from{transform:translate(-50%,-50%) scale(0)}}
#eq{font-size:44px;font-weight:900;color:#2f9e44;height:56px}
svg text{font-family:inherit}
.arc{animation:ai .7s both}@keyframes ai{from{opacity:0}}
#mk{transition:transform .8s ease-in-out}
/* domino */
.dom{display:flex;align-items:center;background:#fffdf2;border:6px solid #3b2a1a;border-radius:34px;padding:12px;box-shadow:0 8px 0 rgba(0,0,0,.2)}
.hf{width:190px;height:190px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:16px;border-radius:22px;transition:.6s}
.hf i{display:flex;align-items:center;justify-content:center}.hf i.dt:after{content:"";width:38px;height:38px;border-radius:50%;background:#111}
.ln{width:8px;height:170px;background:#3b2a1a;border-radius:4px;margin:0 4px}
.hf.hl{background:#ffe08a;box-shadow:0 0 0 6px #ff9a1f}.hf.dim{opacity:.2}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fly{position:absolute;left:0;top:0;width:90px;height:90px;object-fit:contain}
.cf{position:absolute;top:-40px;width:20px;height:30px;border-radius:4px;animation:fall 3.6s ease-in forwards}
@keyframes fall{to{transform:translateY(1150px) rotate(540deg);opacity:.9}}
.win .card{border-color:#2f9e44;background:#e9fbe9}
.bp{display:flex;gap:40px;justify-content:center}.bp .big{font-size:48px;padding:16px 50px}
.wn{font-size:70px;font-weight:900;color:#2f9e44;line-height:1.1}.th{font-size:46px;font-weight:800}
@media (prefers-reduced-motion:reduce){.chr,.ab.ok{animation:none}}
</style></head><body>
<div id="stage">
<div id="bg"></div>
<div id="hdr"><span id="stg"></span><span id="cnt"></span></div>
<div class="col L" data-t="A"><div class="card"><div class="tn">Алмалар</div><div class="sc">0</div><div class="turn">Сендердің кезектерің!</div></div><div class="bkw"></div><img class="chr" data-i="ata" alt="Ата"></div>
<div class="col R" data-t="P"><div class="card"><div class="tn">Алмұрттар</div><div class="sc">0</div><div class="turn">Сендердің кезектерің!</div></div><div class="bkw"></div><img class="chr" data-i="azhe" alt="Әже"></div>
<div id="panel">
 <div id="home" class="scr on"><h1>Ата мен әжеге көмектесейік!</h1><div class="sub">2, 3 сандарын қосу және азайту</div><div class="rule">Есепті шығар. Дұрыс жауапты таңда. Себетіңе жеміс жина!</div><button class="big" id="go">Ойынды бастау</button></div>
 <div id="game" class="scr"><div id="instr"></div><div id="viz"></div><div id="expr"></div><div id="ans"></div><div id="bot"><div id="fb"></div><button id="next">Келесі ▶</button></div></div>
 <div id="fin" class="scr"><div class="th">Жарайсыңдар! Ата мен әжеге көмектестіңдер!</div><div class="wn" id="wn"></div><div class="th" id="fs2"></div><div class="bp"><button class="big" id="again">Қайта ойнау</button><button class="big" id="homeb">Басты бет</button></div></div>
</div>
<div id="tools"><button id="snd">Дыбыс: қосулы</button><button id="fsb">Толық экран</button></div>
<div id="fx"></div>
</div>

function tone(seq,type,vol){if(!S.snd||!AC)return;let t=AC.currentTime;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.15,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05);t+=d*.8})}
const sOk=()=>tone([[523,.14],[659,.14],[784,.28]]),sBad=()=>tone([[300,.18],[250,.28]],'triangle',.1),sDone=()=>tone([[523,.15],[659,.15],[784,.15],[1047,.4],[784,.15],[1047,.5]]);
$('#snd').onclick=()=>{S.snd=!S.snd;$('#snd').textContent='Дыбыс: '+(S.snd?'қосулы':'өшірулі')};
$('#fsb').onclick=()=>{try{const d=document;if(!d.fullscreenElement){const r=d.documentElement.requestFullscreen&&d.documentElement.requestFullscreen();r&&r.catch&&r.catch(()=>{})}else d.exitFullscreen()}catch(e){}};
/* себеттер */
const SL=[[24,40],[50,40],[76,40],[24,22],[50,22],[76,22]];
function bkHTML(t,n){return'<div class="bk"><img src="'+IMG.basket+'" alt="">'+SL.slice(0,n).map((p,i)=>'<img class="fr" style="left:'+p[0]+'%;top:'+p[1]+'%;z-index:'+(i<3?3:2)+'" src="'+IMG[FR[t]]+'" alt="">').join('')+'</div>'}
function side(){['A','P'].forEach(t=>{const c=$('.col[data-t='+t+']');c.querySelector('.sc').textContent=S.sc[t];c.querySelector('.bkw').innerHTML=bkHTML(t,S.sc[t]);
 c.querySelector('.card').classList.toggle('act',S.scr==='game'&&T[S.i].t===t)})}
function show(n){S.scr=n;$$('.scr').forEach(e=>e.classList.toggle('on',e.id===n));$('#hdr').style.visibility=n==='game'?'visible':'hidden';side()}
/* көрнекілер */
const ex=(t,f)=>t.e.map(x=>{if(x==='?'||x==='□')return'<span class="box'+(f?' ok':'')+'" id="bx">'+(f?t.a:x==='?'?'?':'')+'</span>';return'<span>'+(x==='-'?'−':x)+'</span>'}).join('');
const cup=()=>'<div class="cup"><img src="'+IMG.kese+'" alt=""></div>';
function vizCup(t){const k=Math.abs(t.d),m=t.d>0?t.n:t.n-k;
 return'<div class="cups '+(t.d>0?'add':'sub')+'"><div class="grp" id="g0">'+cup().repeat(m)+'</div><div class="grp x" id="g1"><span class="lab">'+(t.d>0?'+':'−')+k+'</span>'+cup().repeat(k)+'</div></div>'}
const X=i=>50+i*90;
function vizLine(t){let s='<svg viewBox="0 0 1000 290" width="980" height="284"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="#d9480f"/></marker></defs><line x1="30" y1="170" x2="970" y2="170" stroke="#3b2a1a" stroke-width="8" stroke-linecap="round"/>';
 for(let i=0;i<=10;i++){const st=i===t.n;s+='<line x1="'+X(i)+'" y1="152" x2="'+X(i)+'" y2="188" stroke="#3b2a1a" stroke-width="5"/><text x="'+X(i)+'" y="'+(st?238:232)+'" text-anchor="middle" font-size="'+(st?46:38)+'" font-weight="'+(st?900:700)+'" fill="'+(st?'#d9480f':'#3b2a1a')+'">'+i+'</text>'}
 return s+'<g id="arcs"></g><g id="mk" style="transform:translate('+X(t.n)+'px,170px)"><circle r="21" fill="#ff7a1a" stroke="#fff" stroke-width="6"/></g></svg><div id="eq"></div>'}
const PT={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const hf=n=>'<div class="hf">'+[...Array(9)].map((_,i)=>'<i class="'+(PT[n].includes(i)?'dt':'')+'"></i>').join('')+'</div>';
const vizDom=t=>'<div class="dom">'+hf(t.dm[0])+'<div class="ln"></div>'+hf(t.dm[1])+'</div>';
/* көмек / көрсету */
function demo(t){if(S.demo)return;S.demo=true;
 if(t.k==='cup'){const g=$('#g1');g.classList.add(t.d>0?'merge':'gone');later(()=>{$$('#viz .grp:not(.gone) .cup').forEach(c=>c.classList.add('live'))},800)}
 else if(t.k==='line'){let p=t.n,txt=''+t.n;t.st.forEach((s,i)=>later(()=>{const q=p+s,x1=X(p),x2=X(q),mx=(x1+x2)/2,h=40+Math.abs(x2-x1)*.35;
  $('#arcs').insertAdjacentHTML('beforeend','<g class="arc"><path d="M'+x1+',170 Q'+mx+','+(170-h*2)+' '+x2+',170" fill="none" stroke="#d9480f" stroke-width="6" marker-end="url(#ar)"/><text x="'+mx+'" y="'+(170-h-14)+'" text-anchor="middle" font-size="38" font-weight="900" fill="#d9480f">'+(s>0?'+':'−')+Math.abs(s)+'</text></g>');
  $('#mk').style.transform='translate('+x2+'px,170px)';p=q;txt+=(s>0?' + ':' − ')+Math.abs(s);if(i===t.st.length-1)later(()=>{$('#eq').textContent=txt+' = '+t.a},900)},i*1300+150))}
 else{const h=$$('#viz .hf');if(t.e[1]==='+')h[1].classList.add('hl');else{h[1].classList.add('dim');h[0].classList.add('hl')}}}
$('#viz').addEventListener('click',e=>{const c=e.target.closest('.cup.live');if(!c||c.querySelector('.bd'))return;const v=$('#viz');v.dataset.c=(+v.dataset.c||0)+1;c.insertAdjacentHTML('beforeend','<span class="bd">'+v.dataset.c+'</span>')});
/* ойын барысы */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function opts(t,i){const w=shuffle([t.a-2,t.a-1,t.a+1,t.a+2].filter(v=>v>=0&&v<=10&&v!==t.a)).slice(0,2);w.splice(i%3,0,t.a);return w}
function load(i){S.gen++;S.i=i;S.locked=false;S.helped=false;S.demo=false;const t=T[i];
 $('#stg').textContent=(t.s+1)+'-кезең: '+SN[t.s];$('#cnt').textContent=(i+1)+' / 12';
 $('#instr').innerHTML='<span class="chip"><img src="'+IMG[FR[t.t]]+'" alt="">'+NM[t.t]+'</span><span>'+t.say+(t.k==='line'?(t.st[0]>0?' →':' ←'):'')+'</span>';
 const v=$('#viz');v.dataset.c=0;v.innerHTML=t.k==='cup'?vizCup(t):t.k==='line'?vizLine(t):vizDom(t);
 $('#expr').innerHTML=ex(t,false);const fb=$('#fb');fb.textContent='';fb.className='';$('#next').classList.remove('on');
 S.opts=opts(t,i);$('#ans').innerHTML=S.opts.map(n=>'<button class="ab" data-v="'+n+'">'+n+'</button>').join('');side()}
function pick(b){if(S.scr!=='game'||S.locked||b.disabled)return;const t=T[S.i],v=+b.dataset.v,fb=$('#fb');unlock();
 if(v!==t.a){b.disabled=true;b.classList.add('bad');S.helped=true;fb.textContent='Тағы ойланып көр!';fb.className='r';sBad();demo(t);return}
 S.locked=true;$$('.ab').forEach(x=>{x.disabled=true;if(x!==b)x.classList.add('off')});b.classList.remove('off');b.classList.add('ok');
 $('#expr').innerHTML=ex(t,true);demo(t);
 if(S.helped){fb.textContent='Дұрыс! Бірге үйрендік!';fb.className='g';sOk();later(ready,500)}
 else{fb.textContent='Жарайсың!';fb.className='g';sOk();fly(b,t.t)}}
function ready(){$('#next').classList.add('on')}
function fly(b,tm){const sr=$('#stage').getBoundingClientRect(),r=b.getBoundingClientRect(),bk=$('.col[data-t='+tm+'] .bkw').getBoundingClientRect(),n=S.sc[tm],p=SL[n];
 const x0=(r.left+r.width/2-sr.left)/SC-45,y0=(r.top+r.height/2-sr.top)/SC-45,x1=(bk.left-sr.left)/SC+bk.width/SC*p[0]/100-45,y1=(bk.top-sr.top)/SC+bk.height/SC*p[1]/100-45;
 const im=document.createElement('img');im.className='fly';im.src=IMG[FR[tm]];$('#fx').appendChild(im);const g=S.gen;
 const a=im.animate([{transform:'translate('+x0+'px,'+y0+'px) scale(1.3)'},{transform:'translate('+((x0+x1)/2)+'px,'+(Math.min(y0,y1)-120)+'px) scale(1.1)',offset:.5},{transform:'translate('+x1+'px,'+y1+'px) scale(.93)'}],{duration:1100,easing:'ease-in-out',fill:'forwards'});
 a.onfinish=()=>{im.remove();if(g!==S.gen)return;S.sc[tm]++;side();ready()}}
function next(){if(!$('#next').classList.contains('on'))return;$('#next').classList.remove('on');if(S.i<11)load(S.i+1);else finish()}
function confetti(){const f=$('#fx'),c=['#ff7a1a','#2b79d6','#2f9e44','#e03131','#fcc419','#9c36b5'];for(let i=0;i<48;i++){const d=document.createElement('div');d.className='cf';d.style.cssText='left:'+Math.random()*1900+'px;background:'+c[i%6]+';animation-delay:'+Math.random()*1.2+'s;animation-duration:'+(2.8+Math.random()*1.5)+'s';f.appendChild(d)}later(()=>{f.innerHTML=''},6000)}
function finish(){S.gen++;show('fin');const a=S.sc.A,p=S.sc.P;
 $('#wn').textContent=a===p?'Достық жеңді!':'Жеңімпаз: '+(a>p?NM.A:NM.P)+' тобы!';
 $('#fs2').textContent='Алмалар '+a+' : '+p+' Алмұрттар';sDone();confetti()}
function reset(scr){S.gen++;S.sc={A:0,P:0};S.i=0;S.locked=false;S.helped=false;S.demo=false;$('#fx').innerHTML='';$('#viz').innerHTML='';$('#ans').innerHTML='';$('#next').classList.remove('on');
 if(scr==='game'){show('game');load(0)}else show('home')}
$('#go').onclick=()=>{unlock();reset('game')};$('#again').onclick=()=>reset('game');$('#homeb').onclick=()=>reset('home');$('#next').onclick=next;
$('#ans').addEventListener('click',e=>{const b=e.target.closest('.ab');if(b)pick(b)});
show('home');
</script></body></html>
